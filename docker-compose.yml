services:
  vexta-bridge-v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vexta-bridge-v2
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - DATABASE_PATH=/app/data/vexta_bridge_v2.db
      - ADMIN_SECRET_TOKEN=${ADMIN_SECRET_TOKEN:-vexta_admin_secret_key_2026}
      - ADMIN_SECRET=${ADMIN_SECRET:-${ADMIN_SECRET_TOKEN:-vexta_admin_secret_key_2026}}
    # Admin UI accessible at: http://localhost:8000/admin (Default secret: vexta_admin_secret_key_2026)
    volumes:
      - vexta_bridge_data:/app/data
    networks:
      - vexta-v2-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/api/announcements/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vexta-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-""}
      - TUNNEL_TRANSPORT_PROTOCOL=quic
      - TUNNEL_METRICS=0.0.0.0:2000
    networks:
      - vexta-v2-net
    depends_on:
      vexta-bridge-v2:
        condition: service_healthy

volumes:
  vexta_bridge_data:
    driver: local

networks:
  vexta-v2-net:
    name: vexta-v2-net
    driver: bridge
