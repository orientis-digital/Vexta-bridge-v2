version: '3.8'

services:
  vexta-bridge-v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vexta-bridge-v2
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - RUST_LOG=info
      - DATABASE_PATH=/app/data/vexta_bridge_v2.db
    volumes:
      - vexta_bridge_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/api/announcements/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  vexta_bridge_data:
    driver: local
